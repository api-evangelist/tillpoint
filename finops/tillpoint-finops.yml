description: >-
  FinOps view of Tillpoint spend. Tillpoint is a fixed, recurring SaaS
  subscription rather than a usage-metered API - cost scales with the number of
  registers/terminals and locations, not with API calls or data volume (there is
  no public API to meter). The dominant cost driver is the per-register monthly
  subscription, plus any Multi-store plan for additional locations and terminals.
  All modules are bundled, so there are no per-module add-on charges to allocate.
notes: >-
  Because Tillpoint publishes no usage-based API pricing, this FinOps view treats
  spend as a predictable recurring subscription. Per-unit rates vary by region
  (GBP/USD) and billing term and are not reconciled here. Verify on tillpoint.com.
