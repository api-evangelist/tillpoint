meters:
- name: register_subscription
  description: Recurring per-register (per-terminal) monthly subscription fee.
  unit: register-months
  aggregation: sum
  dimensions:
  - account
  - location
- name: multi_store_subscription
  description: Multi-store plan covering additional terminals and locations.
  unit: subscription-months
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the number of active registers and locations - spend is a direct function of terminal and location count, not API usage.
- name: Allocation
  description: Map each register/location subscription to the store or cost center it serves.
- name: Optimization
  description: Right-size the number of active terminals and choose Single Store vs Multi-store plans; prefer annual billing where the discount applies; all modules are bundled so there is nothing to trim at the module level.
- name: Accountability
  description: Assign an owner per location; review active-register counts monthly against the subscription invoice.
